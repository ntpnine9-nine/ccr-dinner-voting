name: Public production smoke test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify event portal through stable gateway
        run: |
          set -euo pipefail
          BASE="https://vjvptuecwewmqhkedybs.supabase.co/functions/v1/ccr-app"
          curl --fail --location --silent --show-error -D /tmp/index.headers "$BASE/" -o /tmp/index.html
          grep -Eiq '^content-type: text/html(;|$)' /tmp/index.headers
          grep -Fq "CCR After Hours" /tmp/index.html
          grep -Fq "18" /tmp/index.html
          for page in vote.html party.html venue.html guide.html admin.html admin-summary.html; do
            curl --fail --location --silent --show-error "$BASE/$page" -o "/tmp/$page"
          done
          grep -Fq "FOOD VOTE" /tmp/vote.html
          grep -Fq "GIFT EXCHANGE" /tmp/party.html
          grep -Fq "Google Maps" /tmp/venue.html
          grep -Fq "THE COMPLETE NIGHT GUIDE" /tmp/guide.html
          grep -Fq "แดชบอร์ดผู้จัดงาน" /tmp/admin.html
      - name: Verify public assets
        run: |
          set -euo pipefail
          BASE="https://vjvptuecwewmqhkedybs.supabase.co/functions/v1/ccr-app"
          curl --fail --location --silent --show-error -D /tmp/css.headers "$BASE/event.css" -o /tmp/event.css
          curl --fail --location --silent --show-error -D /tmp/js.headers "$BASE/party.js" -o /tmp/party.js
          curl --fail --location --silent --show-error -D /tmp/img.headers "$BASE/assets/menu-cover.jpg" -o /tmp/menu.jpg
          grep -Eiq '^content-type: text/css(;|$)' /tmp/css.headers
          grep -Eiq '^content-type: (text|application)/javascript(;|$)' /tmp/js.headers
          test -s /tmp/menu.jpg
          file --mime-type /tmp/menu.jpg | grep -Fq 'image/jpeg'
      - name: Verify backend admission state
        run: |
          set -euo pipefail
          curl --fail --silent --show-error             "https://vjvptuecwewmqhkedybs.supabase.co/functions/v1/vote"             -H "Origin: https://raw.githack.com"             -H "Content-Type: application/json"             -H "apikey: sb_publishable_NrWLBu3I0QUioXj4rnon5Q_LbLYhsXR"             --data '{"op":"status","campaign":"ccr-2026"}'             -o /tmp/status.json
          grep -Fq '"ok":true' /tmp/status.json
          node -e 'const s=JSON.parse(require("fs").readFileSync("/tmp/status.json")); if(!s.ok || typeof s.open!=="boolean" || !["open","invite"].includes(s.votingMode))process.exit(1)'
