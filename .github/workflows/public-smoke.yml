name: Public production smoke test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check public voter page
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error -D /tmp/index.headers "https://vjvptuecwewmqhkedybs.supabase.co/functions/v1/ccr-app/" -o /tmp/index.html
          grep -Eiq '^content-type: text/html(;|$)' /tmp/index.headers
          grep -Fq "CCR Dinner Voting" /tmp/index.html
          grep -Fq "8 หมวด" /tmp/index.html
      - name: Check public assets
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error -D /tmp/css.headers "https://vjvptuecwewmqhkedybs.supabase.co/functions/v1/ccr-app/styles.css" -o /tmp/styles.css
          curl --fail --location --silent --show-error -D /tmp/js.headers "https://vjvptuecwewmqhkedybs.supabase.co/functions/v1/ccr-app/vote.js" -o /tmp/vote.js
          grep -Eiq '^content-type: text/css(;|$)' /tmp/css.headers
          grep -Eiq '^content-type: (text|application)/javascript(;|$)' /tmp/js.headers
          test -s /tmp/styles.css
          grep -Fq "getCatalog" /tmp/vote.js
      - name: Check admin page
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error "https://vjvptuecwewmqhkedybs.supabase.co/functions/v1/ccr-app/admin.html" -o /tmp/admin.html
          grep -Fq "แดชบอร์ดผู้จัดงาน" /tmp/admin.html
      - name: Check public backend status
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "https://vjvptuecwewmqhkedybs.supabase.co/functions/v1/vote" \
            -H "Content-Type: application/json" \
            -H "apikey: sb_publishable_NrWLBu3I0QUioXj4rnon5Q_LbLYhsXR" \
            --data '{"op":"status","campaign":"ccr-2026"}' \
            | tee /tmp/status.json
          grep -Fq '"ok":true' /tmp/status.json
          grep -Fq '"open":false' /tmp/status.json
