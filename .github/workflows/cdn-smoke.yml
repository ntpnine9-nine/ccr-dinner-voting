name: Public CDN browser smoke test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify event portal HTML pages
        run: |
          set -euo pipefail
          BASE="https://raw.githack.com/ntpnine9-nine/ccr-dinner-voting/main"
          for page in index.html vote.html party.html venue.html guide.html admin.html; do
            curl --fail --location --silent --show-error -D "/tmp/$page.headers" "$BASE/$page" -o "/tmp/$page"
            grep -Eiq '^content-type: text/html(;|$)' "/tmp/$page.headers"
          done
          grep -Fq "CCR After Hours" /tmp/index.html
          grep -Fq "GIFT EXCHANGE" /tmp/party.html
          grep -Fq "Google Maps" /tmp/venue.html
          grep -Fq "THE COMPLETE NIGHT GUIDE" /tmp/guide.html
      - name: Verify styles scripts and authentic menu assets
        run: |
          set -euo pipefail
          BASE="https://raw.githack.com/ntpnine9-nine/ccr-dinner-voting/main"
          curl --fail --location --silent --show-error -D /tmp/css.headers "$BASE/event.css" -o /tmp/event.css
          curl --fail --location --silent --show-error -D /tmp/js.headers "$BASE/party.js" -o /tmp/party.js
          curl --fail --location --silent --show-error -D /tmp/cover.headers "$BASE/assets/menu-cover.jpg" -o /tmp/cover.jpg
          curl --fail --location --silent --show-error "$BASE/assets/menu-spread.jpg" -o /tmp/spread.jpg
          grep -Eiq '^content-type: text/css(;|$)' /tmp/css.headers
          grep -Eiq '^content-type: (text|application)/javascript(;|$)' /tmp/js.headers
          test -s /tmp/cover.jpg
          file --mime-type /tmp/cover.jpg | grep -Fq 'image/jpeg'
          test -s /tmp/spread.jpg
      - name: Verify API CORS and admission state
        run: |
          set -euo pipefail
          curl --fail --silent --show-error -D /tmp/api.headers             "https://vjvptuecwewmqhkedybs.supabase.co/functions/v1/vote"             -H "Origin: https://raw.githack.com"             -H "Content-Type: application/json"             -H "apikey: sb_publishable_NrWLBu3I0QUioXj4rnon5Q_LbLYhsXR"             --data '{"op":"status","campaign":"ccr-2026"}'             -o /tmp/status.json
          grep -Eiq '^access-control-allow-origin: https://raw.githack.com' /tmp/api.headers
          grep -Fq '"ok":true' /tmp/status.json
          node -e 'const s=JSON.parse(require("fs").readFileSync("/tmp/status.json")); if(!s.ok || typeof s.open!=="boolean" || !["open","invite"].includes(s.votingMode))process.exit(1)'
