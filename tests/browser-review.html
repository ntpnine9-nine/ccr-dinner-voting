<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CCR Browser QA · actual frontend</title><style>body{margin:0;font:14px system-ui;background:#eee;color:#12372f}header{padding:12px;display:flex;flex-wrap:wrap;gap:16px;background:white;align-items:center}select,button{font:inherit;padding:10px;min-height:44px}main{overflow:auto;padding:16px}iframe{border:1px solid #999;background:white;display:block}output{white-space:pre-wrap;max-width:680px;font-size:12px}</style></head><body><header><b>CCR · Browser QA</b><label>หน้า <select id="page"><option value="index.html">Home</option><option value="venue.html">Venue</option><option value="party.html">RSVP</option><option value="vote.html">Vote</option><option value="guide.html">Guide</option><option value="admin.html">Admin</option><option value="admin-summary.html">Summary</option></select></label><label>ความกว้าง <select id="width"><option>320</option><option>360</option><option selected>390</option><option>430</option><option>768</option><option>1024</option><option>1280</option><option>1440</option><option>1920</option></select></label><button id="measure">ตรวจขนาด</button><output id="result" aria-live="polite">กำลังโหลดหน้าจริง…</output></header><main><iframe id="site" title="หน้าเว็บไซต์ CCR จริง" width="390" height="1200" src="../index.html"></iframe></main><script>
const frame=document.getElementById('site'),page=document.getElementById('page'),width=document.getElementById('width'),result=document.getElementById('result');
async function measure(){try{const doc=frame.contentDocument;await doc.fonts.ready;const v=frame.contentWindow;result.textContent=JSON.stringify({page:page.value,width:v.innerWidth,documentWidth:doc.documentElement.scrollWidth,overflow:doc.documentElement.scrollWidth>v.innerWidth,images:[...doc.images].filter(i=>!i.complete||!i.naturalWidth).map(i=>i.getAttribute('src')),clock:doc.getElementById('seconds')?.textContent||null},null,2);}catch(e){result.textContent=e.message;}}
page.addEventListener('change',()=>{result.textContent='กำลังโหลด…';frame.src='../'+page.value;});width.addEventListener('change',()=>{frame.width=width.value;requestAnimationFrame(measure);});frame.addEventListener('load',measure);document.getElementById('measure').addEventListener('click',measure);
</script></body></html>
